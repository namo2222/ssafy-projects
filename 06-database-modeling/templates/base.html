<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThRead 도서 커뮤니티</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand" href="{% url 'books:index' %}">
        ThRead
      </a>

      <div class="d-flex align-items-center gap-3">
        {% if request.user.is_authenticated %}
        <a href="{% url 'books:create' %}">도서 등록</a>
          <span>{{ request.user.username }}님, 안녕하세요.</span>
          <a href="{% url 'accounts:profile' request.user.username %}">내 프로필</a>

          <form action="{% url 'accounts:logout' %}" method="POST" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">
              로그아웃
            </button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">로그인</a>
          <a href="{% url 'accounts:signup' %}">회원가입</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}
    {% endblock content %}
  </main>
</body>
</html>
