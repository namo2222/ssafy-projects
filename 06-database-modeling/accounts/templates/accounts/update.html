{% extends 'base.html' %}

{% block content %}
  <h1>회원정보 수정</h1>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">수정 저장</button>
    <a href="{% url 'accounts:profile' request.user.username %}">취소</a>
  </form>
{% endblock content %}
