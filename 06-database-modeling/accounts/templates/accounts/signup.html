{% extends 'base.html' %}

{% block content %}
  <h1 class="mb-4">회원가입</h1>

  <form
    action="{% url 'accounts:signup' %}"
    method="POST"
    enctype="multipart/form-data"
  >
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
      가입하기
    </button>
  </form>

  <a href="{% url 'books:index' %}" class="d-inline-block mt-3">
    도서 목록으로
  </a>
{% endblock content %}
