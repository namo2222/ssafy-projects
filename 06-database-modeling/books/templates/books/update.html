{% extends 'base.html' %}

{% block content %}
  <h1 class="mb-4">도서 수정</h1>

  <form action="{% url 'books:update' book.pk %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">수정 저장</button>
    <a href="{% url 'books:detail' book.pk %}" class="btn btn-outline-secondary">
      취소
    </a>
  </form>
{% endblock content %}
