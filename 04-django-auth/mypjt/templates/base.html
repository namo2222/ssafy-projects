<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThRead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="{% url 'books:index' %}">ThRead</a>

      <div class="d-flex gap-3 align-items-center">
        <a class="text-white text-decoration-none" href="{% url 'books:index' %}">INDEX</a>

        {% if user.is_authenticated %}
          <a class="text-white text-decoration-none" href="{% url 'books:create' %}">CREATE</a>
          <a class="text-white" href="{% url 'books:recommend' %}">AI 추천</a>
          <a class="text-white text-decoration-none" href="{% url 'accounts:profile' %}">MY PROFILE</a>
          <form action="{% url 'accounts:logout' %}" method="POST">
            {% csrf_token %}
            <button class="btn btn-sm btn-light">LOGOUT</button>
          </form>
        {% else %}
          <a class="text-white text-decoration-none" href="{% url 'accounts:login' %}">LOGIN</a>
          <a class="text-white text-decoration-none" href="{% url 'accounts:signup' %}">SIGNUP</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    {% block content %}
    {% endblock content %}
  </main>
</body>
</html>
