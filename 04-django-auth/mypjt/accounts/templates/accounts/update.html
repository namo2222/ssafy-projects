{% extends 'base.html' %}

{% block content %}
  <h2>회원정보 수정</h2>
  <hr>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">수정</button>
  </form>

  <hr>
  <a href="{% url 'accounts:change_password' %}" class="btn btn-secondary">비밀번호 변경</a>

  <form action="{% url 'accounts:delete' %}" method="POST" class="d-inline">
    {% csrf_token %}
    <button class="btn btn-danger">회원탈퇴</button>
  </form>
{% endblock content %}
