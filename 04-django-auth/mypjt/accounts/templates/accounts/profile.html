
{% extends 'base.html' %}

{% block content %}
  <h2>내 프로필</h2>
  <hr>

  <h4>{{ user.username }}님의 프로필</h4>

  <p>아이디: {{ user.username }}</p>
  <p>이메일: {{ user.email }}</p>
  <p>이름: {{ user.last_name }}{{ user.first_name }}</p>

  <hr>

  <a href="{% url 'accounts:update' %}"
     class="btn btn-primary">
    회원정보 수정
  </a>

  <a href="{% url 'accounts:change_password' %}"
     class="btn btn-secondary">
    비밀번호 변경
  </a>

  <form action="{% url 'accounts:delete' %}"
        method="POST" class="d-inline">
    {% csrf_token %}
    <button class="btn btn-danger">
      회원탈퇴
    </button>
  </form>
{% endblock content %}
